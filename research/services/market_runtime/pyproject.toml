[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "competition-market-runtime"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<0.116",
    "httpx>=0.25,<0.26",
    "mootdx==0.11.7",
    "pandas>=2.3,<3.0",
    "uvicorn>=0.30,<1.0",
    "vnpy==4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
include = ["market_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
