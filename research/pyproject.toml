[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "competition-core"
version = "0.1.0"
description = "Thin, isolated core for the stock competition platform"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pandas>=2.3,<3.0",
    "pyarrow>=25.0,<26.0",
    "PyYAML>=6.0,<7.0",
    "tushare>=1.4,<2.0",
    "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=9.0,<10.0",
]

[tool.setuptools.packages.find]
include = [
    "competition_core*",
    "contracts*",
    "adapters*",
    "services*",
    "workflows*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
