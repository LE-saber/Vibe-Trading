[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "competition-qlib-research"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyqlib==0.9.7",
    "pandas>=2.2,<3",
    "pyarrow>=17,<26",
    "pydantic>=2.10,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["qlib_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
