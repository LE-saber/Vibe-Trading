[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-trading"
version = "0.1.0"
description = "Local research, portfolio approval and competition execution workbench"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.128,<0.129", "pydantic>=2.13,<3", "uvicorn>=0.48,<0.49"]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "httpx>=0.28,<0.29", "pytest-cov>=7,<8", "build>=1,<2", "playwright>=1.57,<2"]

[project.scripts]
vibe-trading = "vibe_trading.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vibe_trading = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
